services:
  web:
    image: nginx:alpine
    container_name: my_web_server
    ports:
      # .env의 WEB_PORT를 가져오고, 없으면 8080을 사용
      - "${WEB_PORT:-8080}:80" 
    restart: always

  cache:
    image: redis:alpine
    container_name: my_redis_cache
    # 변수 없이 직접 작성할 수도 있지만, 필요한 경우 아래처럼 넣을 수 있음
    environment:
      - REDIS_MODE=standalone